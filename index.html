<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#2c3e50" />
<title>2-Player Chess · PWA</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"2P Chess","short_name":"Chess","start_url":".","display":"standalone","orientation":"portrait","background_color":"#2c3e50","theme_color":"#2c3e50"}'>
<style>
  *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
  body{margin:0;min-height:100vh;background:linear-gradient(145deg,#1e2a36,#2c3e50);display:flex;align-items:center;justify-content:center;padding:12px}
  .game-container{max-width:540px;width:100%;background:#2c3e50;border-radius:32px;box-shadow:0 20px 40px rgba(0,0,0,.6);padding:20px 16px 24px;display:flex;flex-direction:column;align-items:center;border:1px solid #4a5f73}
  h1{color:#ecf0f1;font-weight:400;font-size:1.6rem;margin:0 0 12px;letter-spacing:2px}
  .link-panel{width:100%;background:#1e2a36;border-radius:48px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .code-label{color:#95a5a6;font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
  .code-value{background:#0f1720;color:#f1c40f;padding:6px 14px;border-radius:24px;font-weight:700;font-size:1.2rem;letter-spacing:2px;font-family:monospace}
  .copy-btn,.reset-btn{background:#3498db;border:none;color:#fff;font-weight:600;padding:8px 18px;border-radius:30px;font-size:.9rem;cursor:pointer;border:1px solid #5dade2}
  .copy-btn:active,.reset-btn:active{transform:translateY(2px)}
  .reset-btn{background:#e67e22;border-color:#f39c12}
  .status-bar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#ecf0f1;font-size:.95rem;padding:0 8px}
  .turn-indicator{background:#1e2a36;padding:6px 16px;border-radius:40px;display:flex;align-items:center;gap:8px}
  .turn-dot{width:14px;height:14px;border-radius:50%;background:#bdc3c7;transition:.2s}
  .turn-dot.white{background:#f5f5f5;box-shadow:0 0 10px #fff}
  .turn-dot.black{background:#1a1a1a;box-shadow:0 0 8px #000,0 0 0 1px #aaa}
  .player-role{font-size:.85rem;color:#f1c40f;background:#1e2a36;padding:6px 16px;border-radius:40px}
  .board-wrapper{width:100%;aspect-ratio:1/1;background:#1e2a36;border-radius:24px;padding:8px;margin-bottom:8px}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border-radius:16px;overflow:hidden}
  .square{display:flex;align-items:center;justify-content:center;font-size:clamp(1.7rem,8vw,3rem);line-height:1;cursor:pointer;position:relative;background:#f0d9b5;color:#1e1e1e}
  .square.dark{background:#b58863}
  .square.hint{background:#f1c40f!important;box-shadow:inset 0 0 0 3px #f39c12}
  .square.kill-hint{background:#e74c3c!important;box-shadow:inset 0 0 0 3px #c0392b}
  .square.selected{box-shadow:inset 0 0 0 4px #2ecc71}
  .square.last-move{background:#aed6f1!important}
  .square.dark.last-move{background:#5dade2!important}
  .piece-white{color:#fff;text-shadow:0 0 4px #000,0 2px 4px #0008}
  .piece-black{color:#111;text-shadow:0 0 4px #fff,0 1px 3px #fff9}
  .footer-actions{display:flex;width:100%;justify-content:center;margin-top:12px}
  .hidden{display:none!important}
  .choice-overlay{display:flex;gap:20px;justify-content:center;margin-top:8px}
  .color-choice{padding:12px 24px;border-radius:40px;font-weight:700;font-size:1.2rem;border:1px solid #bdc3c7;cursor:pointer;background:#ecf0f1;color:#1e2a36}
  .color-choice.black-choice{background:#1e2a36;color:#ecf0f1;border-color:#4a5f73}
  .waiting-msg{color:#f1c40f;padding:8px;text-align:center;font-size:.95rem}
  .banner{color:#f1c40f;padding:8px;text-align:center;font-size:1rem;font-weight:600}
</style>
</head>
<body>
<div class="game-container">
  <h1>♔ 2‑PLAYER CHESS ♚</h1>

  <div class="link-panel">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="code-label">CODE</span>
      <span class="code-value" id="gameCode">-----</span>
    </div>
    <button class="copy-btn" id="copyLinkBtn">🔗 Copy link</button>
  </div>

  <div class="status-bar">
    <div class="turn-indicator"><span>Turn</span><span class="turn-dot" id="turnDot"></span></div>
    <div class="player-role" id="playerRole">Not joined</div>
  </div>

  <div class="board-wrapper"><div class="board" id="board"></div></div>

  <div id="waitingMsg" class="waiting-msg">Waiting for opponent to join…</div>
  <div id="choicePanel" class="choice-overlay hidden">
    <button class="color-choice white-choice" data-color="w">♔ WHITE</button>
    <button class="color-choice black-choice" data-color="b">♚ BLACK</button>
  </div>
  <div id="startBanner" class="banner hidden">Game started!</div>

  <div class="footer-actions">
    <button class="reset-btn" id="resetBtn">⟲ New Game</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function(){
  // ================= 1. FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyAnhtIVehW_9aAxRYQUXeJfBqCruyW_VaI",
  authDomain: "chess-67dac.firebaseapp.com",
  databaseURL: "https://chess-67dac-default-rtdb.firebaseio.com",
  projectId: "chess-67dac",
  storageBucket: "chess-67dac.firebasestorage.app",
  messagingSenderId: "626396674315",
  appId: "1:626396674315:web:789a8017dffbac0e630a0e"
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ================= 2. STATE =================
  const myId = Math.random().toString(36).slice(2,10);
  let gameId = '';
  let myColor = null;
  let board = [];
  let turn = 'w';
  let selected = null;
  let lastMove = null;
  let presenceCount = 0;
  let whitePlayerId = null;
  let blackPlayerId = null;

  // ================= 3. DOM =================
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), gameCodeEl = $('gameCode'), copyBtn = $('copyLinkBtn'),
        turnDot = $('turnDot'), playerRoleEl = $('playerRole'),
        choicePanel = $('choicePanel'), waitingMsg = $('waitingMsg'),
        startBanner = $('startBanner'), resetBtn = $('resetBtn');

  // ================= 4. PIECES =================
  const sym = {w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};

  function initialBoard(){
    const b = Array.from({length:8},()=>Array(8).fill(null));
    const back = ['r','n','b','q','k','b','n','r'];
    for(let c=0;c<8;c++){
      b[0][c]={type:back[c],color:'b'};
      b[1][c]={type:'p',color:'b'};
      b[6][c]={type:'p',color:'w'};
      b[7][c]={type:back[c],color:'w'};
    }
    return b;
  }

  // ================= 5. GAME ID =================
  function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
  const urlGame = new URLSearchParams(location.search).get('game');
  gameId = urlGame ? urlGame.toUpperCase() : makeCode();
  history.replaceState({},'',location.pathname+'?game='+gameId);
  gameCodeEl.textContent = gameId;

  // ================= 6. FIREBASE REFS =================
// ================= 6. FIREBASE REFS =================
const gameRef     = db.ref('games/'+gameId);
const presenceRef = db.ref('games/'+gameId+'/presence/'+myId);

// 6a. Ensure game exists BEFORE writing presence.
//     Use a transaction so we don't clobber an existing game.
gameRef.transaction(current => {
  if(current === null || !current.board){
    return {
      board: initialBoard(),
      turn: 'w',
      lastMove: null,
      whitePlayer: null,
      blackPlayer: null,
      createdAt: Date.now()
    };
  }
  // game already exists — leave it alone (returning undefined aborts the write)
  return undefined;
}, (err) => {
  if(err){
    console.error('transaction failed', err);
    return;
  }
  // 6b. Now that the game node exists, announce presence
  presenceRef.onDisconnect().remove();
  presenceRef.set({ ts: Date.now(), color: null });
});

  // ================= 7. LIVE GAME STATE =================
  gameRef.on('value', snap => {
    const data = snap.val();
    if(!data) return;
    board     = data.board;
    turn      = data.turn;
    lastMove  = data.lastMove || null;
    whitePlayerId = data.whitePlayer || null;
    blackPlayerId = data.blackPlayer || null;

    if(whitePlayerId === myId)      myColor = 'w';
    else if(blackPlayerId === myId) myColor = 'b';
    else                            myColor = null;

    // Clear a selection if it's no longer our turn / piece vanished
    if(selected){
      const p = board[selected.row]?.[selected.col];
      if(!p || p.color !== myColor || turn !== myColor){
        selected = null;
      }
    }

    renderEverything();
  });

  // ================= 8. LIVE PRESENCE COUNT =================
  db.ref('games/'+gameId+'/presence').on('value', snap => {
    presenceCount = snap.exists() ? Object.keys(snap.val()).length : 0;
    renderEverything();
  });

  // ================= 9. MASTER RENDER =================
  // Called by BOTH listeners. This is the fix — the UI is now
  // a pure function of (game state + presence count).
  function renderEverything(){
    const bothPresent = presenceCount >= 2;
    const gameStarted = !!(whitePlayerId && blackPlayerId);

    // --- status text ---
    if(myColor){
      playerRoleEl.textContent = myColor === 'w' ? 'You: White' : 'You: Black';
    } else if(presenceCount < 2){
      playerRoleEl.textContent = 'Waiting…';
    } else {
      playerRoleEl.textContent = 'Pick a color';
    }

    // --- waiting / choice / banner ---
    if(presenceCount < 2){
      waitingMsg.classList.remove('hidden');
      waitingMsg.textContent = 'Waiting for opponent to join… (share the link)';
      choicePanel.classList.add('hidden');
      startBanner.classList.add('hidden');
    } else if(!gameStarted){
      waitingMsg.classList.add('hidden');
      choicePanel.classList.remove('hidden');
      startBanner.classList.add('hidden');
      // Disable a color button if already claimed by the other player
      choicePanel.querySelectorAll('.color-choice').forEach(btn => {
        const c = btn.dataset.color;
        const taken = (c === 'w' && whitePlayerId && whitePlayerId !== myId)
                   || (c === 'b' && blackPlayerId && blackPlayerId !== myId);
        btn.disabled = !!taken;
        btn.style.opacity = taken ? 0.35 : 1;
      });
    } else {
      waitingMsg.classList.add('hidden');
      choicePanel.classList.add('hidden');
      startBanner.classList.remove('hidden');
      startBanner.textContent = myColor
        ? (myColor === 'w' ? 'Game started — you are White' : 'Game started — you are Black')
        : 'Game started — spectator';
    }

    // --- turn dot ---
    turnDot.className = 'turn-dot ' + (turn === 'w' ? 'white' : 'black');

    // --- board ---
    boardEl.innerHTML = '';
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const sq = document.createElement('div');
        sq.className = 'square' + (((r+c)%2) ? ' dark' : '');
        sq.dataset.row = r; sq.dataset.col = c;

        if(lastMove){
          if((lastMove.from.row===r&&lastMove.from.col===c) ||
             (lastMove.to.row===r&&lastMove.to.col===c))
            sq.classList.add('last-move');
        }
        if(selected && selected.row===r && selected.col===c) sq.classList.add('selected');

        const p = board[r]?.[c];
        if(p){
          const s = document.createElement('span');
          s.textContent = sym[p.color][p.type];
          s.className = p.color==='w' ? 'piece-white' : 'piece-black';
          sq.appendChild(s);
        }
        sq.addEventListener('click', () => onSquare(r,c));
        boardEl.appendChild(sq);
      }
    }

    // hints
    if(selected && myColor === turn){
      const moves = legalMoves(selected.row, selected.col);
      for(const sq of boardEl.children){
        const r = +sq.dataset.row, c = +sq.dataset.col;
        if(moves.some(m=>m.row===r&&m.col===c)){
          sq.classList.add(board[r][c] ? 'kill-hint' : 'hint');
        }
      }
    }
  }

  // ================= 10. COLOR CHOICE =================
  choicePanel.addEventListener('click', e => {
    const btn = e.target.closest('.color-choice');
    if(!btn || btn.disabled) return;
    const chosen = btn.dataset.color;

    gameRef.once('value').then(snap => {
      const data = snap.val();
      if(!data) return;
      if(chosen === 'w' && data.whitePlayer && data.whitePlayer !== myId) return;
      if(chosen === 'b' && data.blackPlayer && data.blackPlayer !== myId) return;
      const updates = {};
      updates[chosen === 'w' ? 'whitePlayer' : 'blackPlayer'] = myId;
      gameRef.update(updates);
    });
  });

  // ================= 11. SQUARE CLICK =================
  function onSquare(r,c){
    if(!myColor) return;
    if(!(whitePlayerId && blackPlayerId)) return;   // not started
    if(myColor !== turn) return;                    // not your turn

    if(!selected){
      const p = board[r][c];
      if(p && p.color === myColor){ selected = {row:r,col:c}; renderEverything(); }
      return;
    }

    if(selected.row===r && selected.col===c){ selected=null; renderEverything(); return; }

    const moves = legalMoves(selected.row, selected.col);
    if(moves.some(m=>m.row===r&&m.col===c)){
      // Build the new board locally
      const newBoard = board.map(row => row.slice());
      newBoard[r][c] = newBoard[selected.row][selected.col];
      newBoard[selected.row][selected.col] = null;
      const prevSel = selected;
      selected = null;

      // Commit only if the remote state is still what we expect
      gameRef.once('value').then(snap => {
        const cur = snap.val();
        if(!cur || cur.turn !== turn) return;
        // Re-validate with the actual current board
        const ok = legalMovesOn(cur.board, prevSel.row, prevSel.col)
                    .some(m=>m.row===r&&m.col===c);
        if(!ok) return;
        gameRef.update({
          board: newBoard,
          turn: turn === 'w' ? 'b' : 'w',
          lastMove: { from:{row:prevSel.row,col:prevSel.col}, to:{row:r,col:c} }
        });
      });
    } else {
      const p = board[r][c];
      if(p && p.color === myColor) selected = {row:r,col:c};
      else selected = null;
      renderEverything();
    }
  }

  // ================= 12. LEGAL MOVES =================
  function legalMoves(row,col){ return legalMovesOn(board,row,col); }
  function legalMovesOn(bd,row,col){
    const piece = bd[row]?.[col];
    if(!piece) return [];
    const {type,color} = piece;
    const opp = color==='w'?'b':'w';
    const out = [];
    const slide = (dr,dc)=>{
      for(let i=1;i<8;i++){
        const r=row+dr*i, c=col+dc*i;
        if(r<0||r>7||c<0||c>7) break;
        const t = bd[r][c];
        if(!t) out.push({row:r,col:c});
        else { if(t.color===opp) out.push({row:r,col:c}); break; }
      }
    };
    const step = (r,c)=>{
      if(r<0||r>7||c<0||c>7) return;
      const t = bd[r][c];
      if(!t || t.color===opp) out.push({row:r,col:c});
    };
    if(type==='p'){
      const dir = color==='w'?-1:1, start = color==='w'?6:1;
      if(row+dir>=0&&row+dir<8&&!bd[row+dir][col]){
        out.push({row:row+dir,col});
        if(row===start && !bd[row+2*dir][col]) out.push({row:row+2*dir,col});
      }
      for(const dc of [-1,1]){
        const nr=row+dir, nc=col+dc;
        if(nr>=0&&nr<8&&nc>=0&&nc<8&&bd[nr][nc]?.color===opp) out.push({row:nr,col:nc});
      }
    } else if(type==='n'){
      for(const [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) step(row+dr,col+dc);
    } else if(type==='b'){ slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1); }
    else if(type==='r'){ slide(-1,0);slide(1,0);slide(0,-1);slide(0,1); }
    else if(type==='q'){ slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1);slide(-1,0);slide(1,0);slide(0,-1);slide(0,1); }
    else if(type==='k'){ for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr||dc)step(row+dr,col+dc);} }
    return out;
  }

  // ================= 13. COPY LINK =================
  copyBtn.addEventListener('click',()=>{
    const link = location.origin + location.pathname + '?game=' + gameId;
    navigator.clipboard.writeText(link).then(()=>{
      copyBtn.textContent='✅ Copied';
      setTimeout(()=>copyBtn.textContent='🔗 Copy link',1500);
    }).catch(()=>prompt('Copy this link:',link));
  });

  // ================= 14. NEW GAME =================
resetBtn.addEventListener('click', () => {
  if(!confirm('Start a new game? This ends the current one.')) return;
  // remove our presence from the OLD game before navigating
  presenceRef.remove().finally(() => {
    const newCode = makeCode();
    history.replaceState({},'',location.pathname+'?game='+newCode);
    location.reload();
  });
});

  // ================= 15. CLEANUP =================
//  window.addEventListener('beforeunload',()=>{ presenceRef.remove(); });

  console.log('%cChess game id: '+gameId,'color:#f1c40f;font-weight:bold');
})();
</script>
</body>
</html>
